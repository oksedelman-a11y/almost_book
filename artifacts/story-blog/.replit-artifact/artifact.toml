kind = "web"
previewPath = "/"
title = "Story Blog"
version = "1.0.0"
id = "artifacts/story-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21821

[services.development]
run = "pnpm --filter @workspace/story-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/story-blog", "run", "build" ]
publicDir = "artifacts/story-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21821"
BASE_PATH = "/"
